name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        php: ['8.4', '8.5']
        ts: [nts, zts]

    steps:
      - uses: actions/checkout@v4

      - name: Check out ext-appkit
        uses: actions/checkout@v4
        with:
          repository: php-io-extensions/appkit
          path: appkit

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: Build and install ext-appkit (the .so and the headers avkit compiles against)
        working-directory: appkit
        run: |
          phpize
          ./configure --enable-appkit
          make -j"$(sysctl -n hw.ncpu)"
          sudo make install

      - name: Build
        run: |
          phpize
          ./configure --enable-avkit
          make -j"$(sysctl -n hw.ncpu)"

      - name: Load
        run: |
          php -n -d extension=appkit -d extension="$PWD/modules/avkit.so" -r 'exit(extension_loaded("avkit") ? 0 : 1);'
          php -n -d extension=appkit -d extension="$PWD/modules/avkit.so" --ri avkit
